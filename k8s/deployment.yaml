apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-api
  namespace: customer-a
spec:
  replicas: 2 # one can die and traffic still flows
  selector:
    matchLabels:
      app: tenant-api
  template:
    metadata:
      labels:
        app: tenant-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: tenant-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: TENANT_NAME
              value: customer-a
            - name: APP_VERSION
              value: "0.1.0"
            - name: ALLOW_CRASH
              value: "true"  #drills only
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}