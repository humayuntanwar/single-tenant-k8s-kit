# a ConfigMap holds plain settings (customer name, version) outside the image, so one image can serve every customer. 
# A Secret is the same idea for sensitive values: Kubernetes stores them separately and can limit who reads them. 
#stringData lets you type plain text, and Kubernetes encodes it for you. In real life the value comes from the app's own vault, never from Git.
apiVersion: v1
kind: Secret
metadata:
  name: tenant-api
  namespace: customer-b
type: Opaque
stringData:
  API_KEY: fake-key-for-learing
  