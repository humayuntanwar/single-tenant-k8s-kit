#a spending cap for the namespace. customer-b can reserve at most 1 CPU, 1 GiB of memory and 10 pods in total, so one customer can't starve the others. 
#Side effect: every pod in this namespace must state its requests, or it's refused.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-api
  namespace: customer-b
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    pods: 10
  